const unit = "Points";
const chart = document.getElementById('chart');
function chartSize() {
  const rect = chart.getBoundingClientRect();
  return {
    width: Math.max(Math.floor(rect.width || window.innerWidth), 320),
    height: Math.max(Math.floor(rect.height || window.innerHeight - 88), 260),
  };
}
function resizeChart() {
  if (!chart._fullLayout) return;
  const size = chartSize();
  Plotly.relayout(chart, {width: size.width, height: size.height, autosize: false});
  Plotly.Plots.resize(chart);
}
Object.assign(fig.layout, chartSize(), {autosize: false});
Plotly.newPlot(chart, fig.data, fig.layout, {responsive:true, displayModeBar:false}).then(() => {
  resizeChart();
  requestAnimationFrame(resizeChart);
  setTimeout(resizeChart, 250);
  setTimeout(resizeChart, 1000);
});
window.addEventListener('resize', resizeChart);
new ResizeObserver(resizeChart).observe(chart);

const el = id => document.getElementById(id);
const fmt = v => (v == null || isNaN(+v))
  ? '---'
  : (+v).toLocaleString('ja-JP', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' ' + unit;

function updatePanel(pts) {
  if (!pts || !pts.length) return;
  el('i-date').textContent = (pts[0].x || '---').slice(0,10);
  const c    = pts.find(p => p.data.type === 'candlestick');
  if (c) {
    el('i-open').textContent  = fmt(c.open);
    el('i-high').textContent  = fmt(c.high);
    el('i-low').textContent   = fmt(c.low);
    el('i-close').textContent = fmt(c.close);
  }
}

el('chart').on('plotly_hover',  ev => updatePanel(ev.points));
el('chart').on('plotly_click',  ev => updatePanel(ev.points));
