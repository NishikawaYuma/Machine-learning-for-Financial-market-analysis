const unit = "円";
Plotly.newPlot('chart', fig.data, fig.layout, {responsive:true, displayModeBar:false});

const el = id => document.getElementById(id);
const fmt = v => (v == null || isNaN(+v))
  ? '---'
  : (+v).toLocaleString('ja-JP', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' ' + unit;

function updatePanel(pts) {
  if (!pts || !pts.length) return;
  el('i-date').textContent = (pts[0].x || '---').slice(0,10);
  const c    = pts.find(p => p.data.type === 'candlestick');
  const s25  = pts.find(p => p.data.name === 'SMA 25');
  const s75  = pts.find(p => p.data.name === 'SMA 75');
  const s200 = pts.find(p => p.data.name === 'SMA 200');
  if (c) {
    el('i-open').textContent  = fmt(c.open);
    el('i-high').textContent  = fmt(c.high);
    el('i-low').textContent   = fmt(c.low);
    el('i-close').textContent = fmt(c.close);
  }
  el('i-sma25').textContent  = s25  ? fmt(s25.y)  : '---';
  el('i-sma75').textContent  = s75  ? fmt(s75.y)  : '---';
  el('i-sma200').textContent = s200 ? fmt(s200.y) : '---';
}

el('chart').on('plotly_hover',  ev => updatePanel(ev.points));
el('chart').on('plotly_click',  ev => updatePanel(ev.points));

function toggleMA(btn) {
  const traceIdx = +btn.dataset.trace;
  const panelId  = btn.dataset.panel;
  const color    = btn.dataset.color;
  const isOn     = btn.dataset.on === '1';
  if (isOn) {
    btn.dataset.on = '0';
    btn.style.background = '#fff';
    btn.style.color = color;
    Plotly.restyle('chart', {visible: false}, [traceIdx]);
    el(panelId).style.opacity = '0.3';
  } else {
    btn.dataset.on = '1';
    btn.style.background = color;
    btn.style.color = '#fff';
    Plotly.restyle('chart', {visible: true}, [traceIdx]);
    el(panelId).style.opacity = '1';
  }
}
