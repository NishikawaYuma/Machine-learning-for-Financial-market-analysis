const unit = "USD";
Plotly.newPlot('chart', fig.data, fig.layout, {responsive:true, displayModeBar:false});

const el = id => document.getElementById(id);
const fmt = v => (v == null || isNaN(+v))
  ? '---'
  : (+v).toLocaleString('ja-JP', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' ' + unit;

function updatePanel(pts) {
  if (!pts || !pts.length) return;
  el('i-date').textContent = (pts[0].x || '---').slice(0,10);
  const c    = pts.find(p => p.data.type === 'candlestick');
  if (c) {
    el('i-open').textContent  = fmt(c.open);
    el('i-high').textContent  = fmt(c.high);
    el('i-low').textContent   = fmt(c.low);
    el('i-close').textContent = fmt(c.close);
  }
}

el('chart').on('plotly_hover',  ev => updatePanel(ev.points));
el('chart').on('plotly_click',  ev => updatePanel(ev.points));
