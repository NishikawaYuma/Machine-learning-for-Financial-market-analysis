name: 日次マーケットレポート

on:
  schedule:
    - cron: "0 23 * * 0-4"  # JST 8:00 (UTC Sun–Thu)
    - cron: "0 10 * * 1-5"  # JST 19:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 依存ライブラリインストール
        run: pip install -r requirements.txt

      - name: レポート投稿
        run: |
          python daily_report.py 2>&1 | tee /tmp/report_log.txt
          echo "## マーケットレポート実行結果" >> $GITHUB_STEP_SUMMARY
          grep -E "(Notion ページ|チャートURL|  .+: http)" /tmp/report_log.txt >> $GITHUB_STEP_SUMMARY || true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_MARKET_REPORT_DB_ID: ${{ secrets.NOTION_MARKET_REPORT_DB_ID }}
          GITHUB_TOKEN: ${{ github.token }}
