name: 日次マーケットレポート

on:
  schedule:
    - cron: '0 23 * * 1-5'   # JST 8:00（UTC 23:00 前日）
    - cron: '0 10 * * 1-5'   # JST 19:00（UTC 10:00）
  workflow_dispatch:           # GitHub Actions 画面から手動実行可能

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 依存ライブラリインストール
        run: pip install -r requirements.txt

      - name: レポート投稿
        run: python daily_report.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_MARKET_REPORT_DB_ID: ${{ secrets.NOTION_MARKET_REPORT_DB_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
